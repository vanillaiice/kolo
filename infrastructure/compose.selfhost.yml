# Self-hosted sync server. Set KOLO_DATABASE_PASSWORD and KOLO_PUBLIC_URL (the address tills use, for example
# https://sync.example.com or http://192.168.1.20:8080 on a LAN) in the environment or an .env file next to this file.
# Put a TLS reverse proxy in front for access beyond the LAN. Then create an operator and issue a code per shop:
#   docker compose -f infrastructure/compose.selfhost.yml exec server node apps/server/dist/main.js admin create <name>
#   docker compose -f infrastructure/compose.selfhost.yml exec server node apps/server/dist/main.js invite --label "Shop"
# The operator dashboard is published on this machine only: http://127.0.0.1:8081/admin/ (use an SSH tunnel remotely).
name: kolo-selfhost
services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    # Migrations are explicit and run before serving; a failed migration leaves the previous schema.
    command: ["sh", "-c", "node apps/server/dist/main.js migrate && exec node apps/server/dist/main.js"]
    environment:
      KOLO_HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://kolo:${KOLO_DATABASE_PASSWORD:?Set KOLO_DATABASE_PASSWORD}@postgres:5432/kolo
      KOLO_PUBLIC_URL: ${KOLO_PUBLIC_URL:?Set KOLO_PUBLIC_URL to the address tills use to reach this server}
      # selfhost (default): shops never expire. hosted: shops sync while paid, plus KOLO_GRACE_DAYS (ADR-031).
      KOLO_EDITION: ${KOLO_EDITION:-selfhost}
      KOLO_GRACE_DAYS: ${KOLO_GRACE_DAYS:-7}
      KOLO_BILLING_WEBHOOK_SECRET: ${KOLO_BILLING_WEBHOOK_SECRET:-}
      # Behind the bundled reverse proxy template, so rate limits see client addresses.
      KOLO_TRUST_PROXY: ${KOLO_TRUST_PROXY:-false}
    ports:
      # Sync: put an HTTPS reverse proxy in front (infrastructure/Caddyfile.example). Dashboard: this machine only.
      - "${KOLO_BIND:-127.0.0.1}:${KOLO_SYNC_PORT:-8080}:8080"
      - "127.0.0.1:${KOLO_ADMIN_PORT:-8081}:8081"
    volumes:
      - identity:/var/lib/kolo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kolo
      POSTGRES_PASSWORD: ${KOLO_DATABASE_PASSWORD:?Set KOLO_DATABASE_PASSWORD}
      POSTGRES_DB: kolo
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolo -d kolo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
  identity:
