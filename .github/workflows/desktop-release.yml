name: Desktop draft release
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build Windows installers
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:desktop:win
      - run: npm run smoke:desktop:packaged
      - name: Hash artifacts
        shell: pwsh
        run: |
          Get-ChildItem release/desktop/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/desktop/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: kolo-windows-release
          path: |
            release/desktop/*.exe
            release/desktop/*.blockmap
            release/desktop/SHA256SUMS.txt
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test "$RELEASE_TAG" = "desktop-v$VERSION"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "KOLO Desktop $VERSION" --notes "Windows standalone desktop. See desktop release acceptance documentation."
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release upload "$RELEASE_TAG" release/desktop/*.exe release/desktop/*.blockmap release/desktop/SHA256SUMS.txt --clobber
