# A shared vX.Y.Z tag builds desktop installers; the release becomes public once Android is also uploaded.
# Manual branch runs build Actions artifacts only. See docs/releasing.md.
name: Desktop release (shared KOLO release)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: kolo-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-github.mjs ensure
  desktop:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb
          - os: windows-latest
            platform: windows
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run stage:desktop
      - name: Build installers
        shell: bash
        env:
          # Signing is used when these secrets exist; without them the builds are unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --config apps/desktop/electron-builder.json ${{ matrix.args }} --x64 --publish never
      - if: matrix.platform == 'windows'
        run: npm run smoke:desktop:packaged
      - name: Hash artifacts
        shell: bash
        run: |
          cd release/desktop
          shopt -s nullglob
          sha256sum *.exe *.AppImage *.deb > SHA256SUMS-${{ matrix.platform }}.txt
          cat SHA256SUMS-${{ matrix.platform }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: kolo-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/desktop/*.exe
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.blockmap
            release/desktop/latest*.yml
            release/desktop/SHA256SUMS-*.txt
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" release/desktop/*.exe release/desktop/*.AppImage release/desktop/*.deb \
            release/desktop/*.blockmap release/desktop/latest*.yml release/desktop/SHA256SUMS-*.txt --clobber
      # Microsoft Store package: unsigned on purpose, because the Store signs it. It reuses the
      # unpacked app and stays out of the GitHub release; upload it in Partner Center.
      - name: Build the Microsoft Store package
        if: matrix.platform == 'windows'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          STORE_IDENTITY_NAME: ${{ vars.KOLO_STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.KOLO_STORE_PUBLISHER }}
        run: |
          identity=()
          if [ -n "$STORE_IDENTITY_NAME" ] && [ -n "$STORE_PUBLISHER" ]; then
            identity=(-c.appx.identityName="$STORE_IDENTITY_NAME" -c.appx.publisher="$STORE_PUBLISHER")
          else
            echo "::warning::KOLO_STORE_IDENTITY_NAME/KOLO_STORE_PUBLISHER are unset; the package is for validation only"
          fi
          npx electron-builder --config apps/desktop/electron-builder.json --win appx --x64 --publish never \
            --prepackaged release/desktop/win-unpacked "${identity[@]}"
      - if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: kolo-desktop-msstore
          if-no-files-found: error
          path: release/desktop/*.appx

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Publish when every target is uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-github.mjs publish
