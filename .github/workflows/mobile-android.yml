# Android releases are built locally (docs/releasing.md): a cold runner spends over 40 minutes
# compiling the native modules. This manual workflow still builds the test-signed APK as an
# artifact, or a draft release when run on a shared vX.Y.Z tag.
name: Android release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kolo-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete `tools` package, which current sdkmanager lacks.
          packages: platform-tools
      - run: npm ci
      - name: Check the tag matches the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm run check
      - run: npm run build:mobile:android
      - name: Hash the APK
        run: cd release/mobile && sha256sum *.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: kolo-android-apk
          if-no-files-found: error
          path: |
            release/mobile/*.apk
            release/mobile/SHA256SUMS-android.txt
      - name: Upload to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-github.mjs ensure
          gh release upload "$RELEASE_TAG" release/mobile/*.apk release/mobile/SHA256SUMS-android.txt --clobber
          node scripts/release-github.mjs publish
