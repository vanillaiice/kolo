# Manual runs only (Actions → Run workflow), e.g. before tagging a desktop release.
# The local pre-push hook covers Linux; tagged releases also run the packaged Windows smoke.
name: Desktop Windows acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke:credentials
      - run: npm run stage:desktop
      - name: Build prior-version installer
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='.packaging/desktop/package.json';const d=JSON.parse(fs.readFileSync(p));d.version='0.0.0';fs.writeFileSync(p,JSON.stringify(d));"
          npx electron-builder --config apps/desktop/electron-builder.json --win nsis --x64 --publish never --config.directories.output=release/baseline
      - run: npm run dist:desktop:win
      - run: npm run verify:desktop:win
      - name: Install, upgrade, native-vault and crash acceptance
        shell: pwsh
        run: |
          $env:KOLO_DESKTOP_BASELINE_INSTALLER = (Get-ChildItem release/baseline/*-setup.exe).FullName
          $env:KOLO_DESKTOP_INSTALLER = (Get-ChildItem release/desktop/*-setup.exe).FullName
          npm run smoke:desktop:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Microsoft Store package (validation)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --config apps/desktop/electron-builder.json --win appx --x64 --publish never \
            --prepackaged release/desktop/win-unpacked
      - run: npm run benchmark:desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kolo-windows-installers
          path: |
            release/desktop/*.exe
            release/desktop/*.appx
            release/desktop/*.blockmap
          if-no-files-found: ignore
